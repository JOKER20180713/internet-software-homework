<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusClaw · 教学材料</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f6f4;color:#242424;font:16px/1.6 "Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid #ddd;border-radius:9px;padding:7px 16px;background:white}button.primary{background:#8c001a;color:white;border-color:#8c001a}input{padding:10px 12px;border:1px solid #ddd;border-radius:8px;background:#faf9f7;max-width:100%}.top{height:78px;background:white;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 28px;gap:13px}.logo{background:#8c001a;color:white;font-weight:700;border-radius:12px;padding:8px 12px}.brand{font-size:23px;font-weight:700}.badge{background:#f6e8eb;color:#8c001a;border-radius:20px;padding:1px 12px;font-weight:bold}.user{margin-left:auto;color:#727272}.layout{display:grid;grid-template-columns:330px 1fr;min-height:calc(100vh - 78px)}aside{background:white;border-right:1px solid #ddd}.side-head{display:flex;align-items:center;justify-content:space-between;padding:20px}.side-head h3{font-size:18px;margin:0;color:#666}.row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #e5e5e5;border-radius:0;padding:17px 22px;background:white}.row.active{background:#f5edef}.row time{display:block;font-size:13px;color:#888}.content{padding:34px 40px}.content h1{font-size:27px;margin:0 0 12px}.meta{display:flex;align-items:center;color:#888;margin-bottom:28px}.meta a{margin-left:auto;color:#333;border:1px solid #ddd;padding:7px 15px;border-radius:9px;text-decoration:none}.card{background:white;border:1px solid #e2e2e2;border-radius:14px;box-shadow:0 2px 5px #0001;padding:32px}.card pre{font:18px/1.9 "Microsoft YaHei",sans-serif;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}.login{width:410px;max-width:90vw;margin:80px auto;padding:36px;background:white;border:1px solid #ddd;border-radius:14px}.login h1{margin-top:0;font-size:25px}.login label{display:block;margin:16px 0 6px}.login input,.login button{width:100%}.login button{margin-top:24px}.hint{font-size:14px;color:#777}.error{color:#9c001b;margin-top:15px}.upload-box{background:#fff;border-bottom:1px solid #ddd;padding:15px 20px}.upload-box input{width:100%;font-size:13px;margin-bottom:10px}.upload-box button{font-size:14px}.empty{color:#777}#notice{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:8px;background:#333;color:white} [hidden]{display:none!important}@media(max-width:700px){.top{padding:0 14px;gap:8px}.brand{font-size:17px}.user{font-size:12px}.layout{grid-template-columns:1fr}aside{border-right:0}.content{padding:24px 16px}.badge{font-size:12px}.top button{padding:5px 8px}.top{height:auto;min-height:78px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}}
</style></head><body>
<header class="top"><span class="logo">CC</span><span class="brand">CampusClaw</span><span id="badge" class="badge" hidden></span><span id="user" class="user"></span><button id="knowledge-link" hidden>知识问答</button><button id="logout" hidden>登出</button></header>
<form class="login" id="login"><h1>登录 CampusClaw</h1><p class="hint">教学材料与班级知识库</p><label for="username">用户名</label><input id="username" name="username" autocomplete="username" required><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="primary">登录</button><p id="error" class="error"></p></form>
<div class="layout" id="home" hidden><aside><div class="side-head"><h3>本班材料</h3><button class="primary" id="show-upload" hidden>上传</button></div><form class="upload-box" id="upload" hidden><input type="file" name="file" accept=".txt,.md" required><button class="primary">确认上传</button><span class="hint"> .txt / .md，最多 2 MiB</span></form><div id="list"></div></aside><main class="content"><div id="detail" hidden><h1 id="title"></h1><div class="meta"><span id="meta"></span><a id="download">下载原文件</a></div><article class="card"><pre id="body"></pre></article></div><p id="empty" class="empty">选择左侧材料查看内容。</p></main></div><div id="notice" hidden></div>
<script src="/knowledge-ui.js" defer></script>
<script>document.querySelector('header').insertAdjacentHTML('beforeend','<a href="/platform" style="color:#8c001a;text-decoration:none;border:1px solid #ddd;border-radius:8px;padding:7px 12px">AI 应用平台</a>');</script>
<script>
const $=id=>document.getElementById(id);let user=null;let accessToken=sessionStorage.getItem('campusclaw_token')||'';let identityVersion=0;
function reset(){identityVersion++;user=null;accessToken='';sessionStorage.removeItem('campusclaw_token');$('upload').reset();$('upload').hidden=true;$('home').hidden=true;$('login').hidden=false;$('knowledge-link').hidden=true;if(window.clearKnowledge)clearKnowledge();$('badge').hidden=true;$('logout').hidden=true;$('user').textContent='';$('list').replaceChildren();$('body').textContent='';$('detail').hidden=true;$('empty').hidden=false}
async function api(url,options={}){const headers=new Headers(options.headers||{});if(accessToken)headers.set('Authorization','Bearer '+accessToken);const r=await fetch(url,{...options,headers,credentials:'omit'});const data=await r.json();if(!r.ok){if(r.status===401)reset();throw Error(data.error||'请求失败')}return data}
function notice(text){$('notice').textContent=text;$('notice').hidden=false;setTimeout(()=>$('notice').hidden=true,4000)}
async function openMaterial(m){const version=identityVersion;const d=(await api('/api/materials/'+m.id)).material;if(version!==identityVersion||!user)return;$('detail').hidden=false;$('empty').hidden=true;$('title').textContent=d.title;$('meta').textContent=d.class_code+' 班 · '+d.created_at;$('body').textContent=d.body_text;$('download').href='#';$('download').onclick=async e=>{e.preventDefault();try{const r=await fetch('/api/materials/'+d.id+'/file',{headers:{Authorization:'Bearer '+accessToken},credentials:'omit'});if(!r.ok){if(r.status===401)reset();throw Error('下载失败：'+r.status)}const url=URL.createObjectURL(await r.blob());const a=document.createElement('a');a.href=url;a.download=d.title;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(err){notice(err.message)}};document.querySelectorAll('.row').forEach(e=>e.classList.toggle('active',e.dataset.id===String(m.id)))}
async function loadList(){const version=identityVersion;const rows=(await api('/api/materials')).materials;if(version!==identityVersion||!user)return;$('list').replaceChildren();for(const m of rows){const b=document.createElement('button');b.className='row';b.dataset.id=m.id;const title=document.createElement('span');title.textContent=m.title;const t=document.createElement('time');t.textContent=m.created_at;b.append(title,t);b.onclick=()=>openMaterial(m).catch(e=>notice(e.message));$('list').append(b)}if(rows.length)await openMaterial(rows[0])}
async function showHome(u){user=u;$('login').hidden=true;$('home').hidden=false;$('badge').hidden=false;$('badge').textContent=u.class_code+' 班';$('user').textContent=u.username+' · '+(u.role==='teacher'?'教师':'学生');$('logout').hidden=false;$('knowledge-link').hidden=false;$('show-upload').hidden=u.role!=='teacher';$('upload').hidden=true;await loadList()}
$('login').onsubmit=async e=>{e.preventDefault();$('error').textContent='';try{const r=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});accessToken=r.access_token;sessionStorage.setItem('campusclaw_token',accessToken);$('password').value='';await showHome(r.user)}catch(e){$('error').textContent=e.message}};
$('logout').onclick=async()=>{try{await api('/api/logout',{method:'POST'})}finally{reset()}};
$('show-upload').onclick=()=>{$('upload').hidden=!$('upload').hidden};
$('upload').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget;try{const result=await api('/api/materials',{method:'POST',body:new FormData(form)});form.reset();form.hidden=true;await loadList();notice(result.index_status==='failed'?'材料已保存，索引失败，可重试':'上传成功，已加入本班知识库')}catch(e){notice(e.message)}};
if(accessToken)api('/api/me').then(r=>showHome(r.user)).catch(()=>reset());else reset();
</script></body></html>
