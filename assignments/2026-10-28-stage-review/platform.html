<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusClaw · AI 应用平台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f6f4;color:#28242a;font:15px/1.6 "Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button,a.button{border:1px solid #ded9db;background:#fff;border-radius:8px;padding:8px 15px;cursor:pointer;color:inherit;text-decoration:none}button.primary{background:#8c001a;color:#fff;border-color:#8c001a}button:disabled{opacity:.55;cursor:wait}input,select,textarea{border:1px solid #dcd7d8;border-radius:8px;padding:8px 10px;background:white;width:100%;color:inherit}textarea{resize:vertical}header{height:76px;border-bottom:1px solid #ded9db;background:#fff;padding:0 26px;display:flex;align-items:center;gap:14px}.logo{font-weight:700;background:#8c001a;color:#fff;border-radius:10px;padding:8px 11px}.brand{font-size:23px;font-weight:bold}.sub{color:#8c001a;background:#f5e9ec;padding:2px 10px;border-radius:16px}.identity{margin-left:auto;color:#777}.shell{display:grid;grid-template-columns:minmax(530px,1fr) minmax(570px,1fr);gap:0;min-height:calc(100vh - 76px)}.workspace{padding:26px 28px}.eyebrow{font-size:12px;letter-spacing:2px;color:#8c001a;font-weight:bold}h1{font-size:26px;margin:4px 0 4px}h2{font-size:19px;margin:0 0 12px}.muted{color:#7a7378;font-size:13px}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.app{text-align:left;padding:13px 11px;border-radius:10px;min-height:90px}.app strong{display:block;font-size:15px}.app small{display:block;font-size:11px;color:#8b8285;margin-top:5px}.app.active{background:#8c001a;color:white;border-color:#8c001a}.app.active small{color:#ead3d8}.panel{background:white;border:1px solid #e2dedf;border-radius:12px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bar{display:flex;align-items:center;gap:10px}.bar>*{flex:1}.bar .fixed{flex:0 0 auto}.field-label{display:block;font-size:13px;color:#6d6268;margin:9px 0 5px}summary{cursor:pointer;font-weight:600}.template{font-size:13px;margin-top:10px}.answer{white-space:pre-wrap;font-size:16px;line-height:1.8}.question{background:#f5edef;border-left:3px solid #8c001a;padding:10px 14px;margin-bottom:14px;white-space:pre-wrap}.sources{font-size:13px;color:#59515a}.sources details{margin-top:10px;padding:8px;background:#f7f6f4;border-radius:6px}.sources pre{white-space:pre-wrap;font:inherit}.inspector{background:#fff;border-left:1px solid #d9d4d6;padding:25px;min-width:0}.inspector h2{display:flex;align-items:center;justify-content:space-between}.live{font-size:11px;border:1px solid #b9d9c7;color:#267047;border-radius:12px;padding:2px 8px}.stats{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.stat{background:#f5f4f4;border-radius:8px;padding:8px 12px;font-size:12px}.stat b{color:#8c001a;font-size:17px;margin-right:5px}.tabs{display:flex;gap:6px;margin:12px 0}.tabs button.selected{background:#f2e4e8;border-color:#8c001a;color:#8c001a}.json{font:12.5px/1.65 Consolas,"Microsoft YaHei",monospace;background:#faf9f8;border:1px solid #e5e0e2;border-radius:9px;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:680px;overflow:auto;margin:0;color:#313e48}.status{color:#8c001a;font-size:13px;margin:10px 0;min-height:20px}.login{max-width:420px;margin:85px auto;padding:30px;background:white;border:1px solid #ddd;border-radius:14px}.login input{margin-bottom:15px}.login button{width:100%}[hidden]{display:none!important}#upload-status{font-size:12px;color:#2d7050}#new-conversation{font-size:12px}footer{margin-top:16px;font-size:11px;color:#8a8185}@media(max-width:1000px){.shell{grid-template-columns:1fr}.inspector{border-left:0;border-top:1px solid #ddd}.apps{grid-template-columns:repeat(2,1fr)}header{height:auto;min-height:76px;flex-wrap:wrap;padding:12px}.brand{font-size:20px}.workspace{padding:20px}.json{max-height:650px}}
</style></head><body>
<header><span class="logo">CC</span><span class="brand">CampusClaw</span><span class="sub">AI 应用平台</span><span class="identity" id="identity"></span><a class="button" href="/">班级材料</a><button id="logout" hidden>登出</button></header>
<form id="login" class="login"><h1>登录 AI 应用平台</h1><p class="muted">复用班级账号与 Token 身份认证</p><label>用户名<input id="username" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button class="primary">登录</button><div class="status" id="login-error"></div></form>
<main class="shell" id="shell" hidden><section class="workspace"><div class="eyebrow">APPLICATION WORKSPACE</div><h1>选择应用，开始对话</h1><div class="muted">提示词模板 · 本班知识 · Skill 技能 · 外部工具</div><nav class="apps" id="apps"></nav>
<section class="panel"><details id="template-details"><summary>提示词模板 <span class="muted">每轮渲染并发送</span></summary><textarea id="template" class="template" rows="3"></textarea><div class="grid"><label class="field-label">面向对象<input id="audience" value="大学生"></label><label class="field-label">回答风格<input id="style" value="简洁清晰"></label></div><button id="save-template" style="margin-top:10px">保存当前应用模板</button></details>
<div class="grid"><label class="field-label">绑定 Skill<select id="skill"><option value="">不绑定技能</option></select></label><label class="field-label" id="tool-label" hidden>工具通道<select id="tool-mode"><option value="http">外部 HTTP 计算器</option><option value="mcp">MCP · get-sum 加法</option></select></label></div>
<details style="margin-top:12px"><summary class="muted">上传 Skill（.md）</summary><div class="bar" style="margin-top:8px"><input id="skill-file" type="file" accept=".md"><button class="fixed" id="upload-skill">上传</button></div><div id="upload-status"></div></details></section>
<form id="chat-form"><label class="field-label" for="question">你的问题</label><textarea id="question" rows="3" placeholder="输入问题，运行后在右侧查看真实调用记录" required maxlength="2000"></textarea><div class="bar" style="margin-top:10px"><button class="primary fixed" id="send">发送</button><button type="button" id="new-conversation" class="fixed">新对话</button><span class="muted" id="conversation-status">当前为新对话</span></div></form><div id="status" class="status"></div>
<section id="result" class="panel" hidden><div id="user-question" class="question"></div><div id="answer" class="answer"></div><div id="sources" class="sources"></div></section><footer>演示应用仅在本机运行。完整调用记录仅当前登录用户可见。</footer></section>
<aside class="inspector"><h2>调用记录 <span class="live">真实接口数据</span></h2><p class="muted">查看服务端实际发送的 JSON、模型返回与工具执行结果；不包含密钥或登录令牌。</p><select id="trace-list"><option value="">选择历史对话记录</option></select><div class="stats" id="stats"><span class="stat">发送问题后显示本次记录</span></div><select id="event-list"><option value="">等待调用</option></select><div class="tabs"><button id="tab-request" class="selected">请求参数</button><button id="tab-response">返回内容</button><button id="tab-overview">本轮概览</button><button id="download-trace">下载 JSON</button></div><pre class="json" id="json">暂无记录</pre></aside></main><script src="/platform.js"></script></body></html>
