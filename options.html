<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>交作业 · 设置</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand"><img src="assets/icon.png" alt="" /><span>交作业</span></div>
      <nav aria-label="设置导航">
        <a class="active" href="#identity"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg></span><span>身份信息</span></a>
        <a href="#automation"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34A1.7 1.7 0 0 0 14 20.93V21h-4v-.08A1.7 1.7 0 0 0 8.95 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3v-4h.08A1.7 1.7 0 0 0 4.6 8.95a1.7 1.7 0 0 0-.34-1.88L4.2 7l2.83-2.83.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 10 3.03V3h4v.08a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06L19.8 7l-.06.06a1.7 1.7 0 0 0-.34 1.88A1.7 1.7 0 0 0 20.96 10H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z"/></svg></span><span>自动化</span></a>
        <a href="#about"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 10.5V17M12 7.2v.1"/></svg></span><span>关于</span></a>
      </nav>
    </aside>

    <main>
      <header><h1>设置</h1></header>
      <form id="settingsForm" novalidate>
        <section id="identity" class="settings-section">
          <h2>身份信息</h2>
          <p class="intro">这些信息只保存在你的浏览器中。</p>

          <div class="field-row">
            <label for="studentId">学号</label>
            <div><input id="studentId" name="studentId" maxlength="30" autocomplete="off" required /><small>仅保存在当前浏览器的本地扩展存储中</small></div>
          </div>
          <div class="field-row">
            <label for="name">姓名</label>
            <div><input id="name" name="name" maxlength="100" autocomplete="off" required /><small>不会写入源码、Git 提交或远程仓库</small></div>
          </div>
          <div class="field-row">
            <label for="repoUrl">仓库地址</label>
            <div><input id="repoUrl" name="repoUrl" type="url" placeholder="自动读取 Git 远程地址，也可手动填写" /><small>可留空，之后在 GitHub / Gitee 仓库页由扩展自动识别</small></div>
          </div>
          <div class="field-row">
            <label for="collectionUrl">回收系统地址</label>
            <div><input id="collectionUrl" name="collectionUrl" type="url" readonly /><small>当前扩展仅对该课程回收页面生效</small></div>
          </div>
        </section>

        <section id="automation" class="settings-section separated-section">
          <h2 class="sr-only">自动化</h2>
          <div class="toggle-row">
            <span><strong>进入页面时自动填写</strong><small>固定开启；只填写空白字段，不覆盖你已经输入的内容</small></span>
            <label class="switch"><input id="autoFill" type="checkbox" role="switch" checked disabled /><i></i><span class="sr-only">进入页面时自动填写</span></label>
          </div>
          <div class="toggle-row">
            <span><strong>填写后自动提交</strong><small>固定开启；作业内容只填写远程仓库 URL，重复提交会被自动拦截</small></span>
            <label class="switch"><input id="autoSubmit" type="checkbox" role="switch" checked disabled /><i></i><span class="sr-only">填写后自动提交</span></label>
          </div>
        </section>

        <div class="save-bar">
          <button class="save-button" type="submit">保存设置</button>
          <span id="saveStatus" role="status" aria-live="polite"></span>
        </div>

        <section id="about" class="settings-section separated-section about-section">
          <h2>关于</h2>
          <p>“交作业”仅在指定课程回收页运行。身份与仓库信息平时只保存在当前浏览器中；提交作业时，仅发送给设置中显示的课程回收系统。</p>
          <button class="text-button" id="resetHistory" type="button">清除防重复记录</button>
        </section>
      </form>
    </main>

    <script src="src/shared.js"></script>
    <script src="src/options.js"></script>
  </body>
</html>
